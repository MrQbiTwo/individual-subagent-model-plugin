# Declarative inventory of the repository labels. Keep this in sync with the
# labels used by the issue templates and the CI/release failure trackers.
- name: bug
  color: "d73a4a"
  description: "Something isn't working"
- name: ci-codex
  color: "5319e7"
  description: "CI failure in the Codex adapter job"
- name: ci-compat
  color: "fbca04"
