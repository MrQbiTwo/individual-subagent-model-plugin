[project]
name = "subagent-model-plugin-tests"
version = "0.0.0"
description = "Test tooling for individual-subagent-model-plugin (not a distributed package)"
requires-python = ">=3.12.3"
dependencies = []

# This project owns only the Python test tooling; it is not installed as a package.
[tool.uv]
package = false

[dependency-groups]
dev = [{ include-group = "test" }, { include-group = "lint" }]
test = [
  # pytest 9 changed Node.nodeid to use _id; xdist 3.8 still patches _nodeid,
  # so --dist=loadgroup silently stops grouping (npm tests run concurrently).
  "pytest>=8,<10",
  "pytest-xdist>=3.6,<4",
  "pytest-cov>=5,<7",
  "httpx>=0.27,<1",
  "pexpect>=4.9,<5",
  "PyYAML>=6,<7",
]
lint = ["ruff>=0.8,<1", "ty>=0.0.1a1,<1"]

[tool.pytest.ini_options]
minversion = "8"
testpaths = ["universal", "adapters", "unit"]
addopts = "-ra --strict-markers --dist=loadgroup"
markers = [
  "unit: fast isolated tests that need no external process",
  "integration: tests that use the core probe and a live OpenCode server",
  "e2e: end-to-end tests that drive the real OpenCode client or CLI",
  "universal: host-free core tests (no OpenCode SDK, SolidJS or Node host APIs)",
  "contract: adapter contract tests (fake host, no live server)",
  "opencode_cli: OpenCode CLI adapter contract and live-server checks",
  "opencode_desktop: OpenCode Desktop GUI plugin contract (static + Node probe)",
]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["ALL"]
ignore = [
  "ANN",     # test helpers are deliberately untyped at the signature level
  "COM812",  # conflicts with the formatter
  "CPY001",  # test files do not carry per-file copyright headers
  "D",       # test docstrings are optional
  "EM101",   # plain assert messages are clearer in tests
  "EM102",
  "INP001",  # tests/ is not an installable package
  "ISC001",  # conflicts with the formatter
  "PLR2004", # magic values are expected in fixtures
  "PT011",   # broad raises are fine in test helpers
  "S101",    # pytest relies on assert
  "S603",    # subprocess calls use fixed argument lists
  "S607",    # executables are resolved with shutil.which where needed
  "TRY003",  # long messages outside exception classes are fine here
]

[tool.ruff.lint.per-file-ignores]
"tests/unit/test_wsl_independence.py" = ["RUF100"]

[tool.ty.terminal]
error-on-warning = true

[tool.ty.environment]
python-version = "3.12"

[tool.ty.rules]
possibly-unresolved-reference = "error"
unused-ignore-comment = "warn"
